# Default sensitive-field specs: what to detect and how to mask it.
#
# One entry per field:
#   pattern   - regex source (compiled at load; empty for heuristic-only fields
#               like person_name / company_name)
#   heuristic - "checksum_id"   ID-card checksum per GB 11643
#               "checksum_uscc" USCC checksum per GB 32100
#               "surname_context" / "company_suffix" dictionary heuristics
#   mask      - fixed `template`, or keep_head/keep_tail/mask_char to keep the
#               first/last N characters
#   enabled   - fields disabled by default are still detected when explicitly
#               named via `--fields`
#   confidence- rule-hit confidence (priority reference vs LLM on overlaps)
#
# Masks are fixed-length so markdown tables stay aligned.

phone:
  label: phone number
  pattern: '(?<!\d)1[3-9]\d{9}(?!\d)'
  confidence: 1.0
  mask: { keep_head: 3, keep_tail: 4, mask_char: '*' }

id_card:
  label: national ID number
  pattern: '(?<![0-9A-Za-z])[1-9]\d{16}[\dXx](?![0-9A-Za-z])'
  heuristic: checksum_id
  confidence: 1.0
  mask: { keep_head: 6, keep_tail: 4, mask_char: '*' }

email:
  label: email address
  pattern: '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?![A-Za-z0-9])'
  confidence: 1.0
  mask: { template: '****@***' }

credit_code:
  label: unified social credit code
  pattern: '(?<![0-9A-Za-z])[0-9A-HJ-NPQRTUWXY]{18}(?![0-9A-Za-z])'
  heuristic: checksum_uscc
  confidence: 1.0
  mask: { keep_head: 0, keep_tail: 4, mask_char: '*' }

stock_code:
  label: stock code
  pattern: '(?<!\d)(?:60\d{4}|68\d{4}|00\d{4}|30\d{4})(?!\d)'
  confidence: 0.8
  mask: { template: '******' }

bank_account:
  label: bank account number
  pattern: '(?<!\d)\d{16,19}(?!\d)'
  confidence: 0.5
  enabled: false
  mask: { keep_head: 4, keep_tail: 4, mask_char: '*' }

person_name:
  label: person name
  pattern: ''
  heuristic: surname_context
  confidence: 0.9
  mask: { template: '***' }

company_name:
  label: company name
  pattern: ''
  heuristic: company_suffix
  confidence: 0.9
  mask: { template: '****' }
