# 管道配置：各阶段开关与参数（pysanitize sanitize 读取）。
#
# 命令行参数优先于此文件；未指定的项用这里给的值。

text:
  detector: rules            # rules | llm | hybrid
  model: deepseek-v4-flash   # LLM 模型（config/llm/<model>.yaml 文件名，detector 为 llm/hybrid 时）
  provider: openai           # config/llm/<model>.yaml 里的 provider 段：openai | pingan
  verify_checksums: true     # 校验身份证/信用代码校验位（rules 模式）

image:
  enabled: false             # --mask-images 可临时打开
  classes: []                # 打码目标：face | text | <YOLO 类别名>（如 person,car）；空 = 不检测图片
  detector: auto             # 人脸后端（classes 含 face 时）：auto | yunet | haar | yolo
  score_threshold: 0.5       # 检测置信度阈值
  mosaic_factor: 16          # 马赛克块大小
  model_path: ""             # 检测模型权重（YuNet onnx / YOLO .pt；默认自动下载）

output:
  audit: false               # --audit 时额外写出含原文的 sensitive_report.json
