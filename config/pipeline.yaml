# Pipeline config: per-stage switches and parameters (read by `pysanitize sanitize`).
#
# CLI flags take precedence over this file; anything not passed on the command
# line falls back to the values here.

text:
  detector: rules            # rules | llm | hybrid
  model: deepseek-v4-flash   # LLM model (config/llm/<model>.yaml filename, when detector is llm/hybrid)
  provider: openai           # provider section in config/llm/<model>.yaml: openai | pingan
  verify_checksums: true     # validate ID-card / USCC checksums (rules mode)

image:
  enabled: false             # can be flipped on temporarily with --mask-images
  classes: []                # mask targets: face | text | <YOLO class name> (e.g. person,car); empty = no image detection
  detector: auto             # face backend (when classes include face): auto | yunet | haar | yolo
  score_threshold: 0.5       # detection confidence threshold
  mosaic_factor: 16          # mosaic block size
  model_path: ""             # detection weights (YuNet onnx / YOLO .pt; auto-downloaded by default)

output:
  audit: false               # also write sensitive_report.json with raw values when --audit
