[project]
name = "pysanitize"
version = "0.2.0"
description = "Multi-format document desensitization (PDF/DOCX/Excel/scans): MinerU parse + rules/LLM sensitive-field detection + text/image masking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1",
    "python-dotenv",
    "colorlog",
    "pyyaml",
    "lxml",
    "pydantic>=2",
    "numpy",
    "Pillow",
    "opencv-python>=4.8,<5.0",  # <5 keeps CascadeClassifier (Haar offline fallback); 5.x removed it
    "json-repair",
    "six",  # mineru[pipeline] imports it transitively but doesn't declare it
    "mineru[pipeline]>=3.4.4",
    # PDF redaction (`redacted.pdf`). MinerU only *reads* PDFs; faithful redaction
    # (delete glyphs, keep table borders) needs a writer — pymupdf is the only
    # dependency that preserves the original page content. AGPLv3-licensed;
    # fine for internal tooling, see README.
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab",
]

[project.optional-dependencies]
# Interactive TUI (`pysanitize --launch tui`): Textual app for field selection,
# options and run monitoring. The plain CLI works without it.
tui = ["textual>=3.0"]
# YOLO-based object detection (heavier; GPU-capable). Default face backend is
# OpenCV YuNet, which needs no extra install. Needed for any `--image-classes`
# other than `face` (and for face with `--image-backend yolo`).
image-yolo = ["ultralytics"]
# OCR text-region detection (`--image-classes text`): masks every printed text
# region in an image. Ships paddlepaddle, which is heavy.
image-ocr = ["paddleocr"]
# M2 milestone: redact original-format documents (docx/xlsx).
render-office = ["python-docx", "openpyxl"]
# PingAn intranet gateway (--provider pingan): pulls in pycryptodome for the
# gateway's RSA/HMAC signing (pysanitize/llm/provider/pingan.py).
llm-pingan = ["pycryptodome"]
# Reversible masking (`--recoverable` / `pysanitize --recover`): AES-256-GCM
# tokens via pysanitize/recover. Without it, --recoverable fails fast instead
# of silently producing unrecoverable output.
recover = ["cryptography>=42"]

[project.scripts]
pysanitize = "pysanitize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pysanitize"]
