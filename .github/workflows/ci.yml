name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        # The full suite needs both the TUI extra (textual — test_tui.py) and the
        # recover extra (cryptography — test_recover.py). The heavier image/office
        # extras degrade gracefully in tests and are left out to keep runners lean.
        run: uv sync --frozen --extra tui --extra recover

      - name: Run tests
        run: uv run pytest -q
